[project]
name = "jev-magic-tower"
version = "0.1.0"
description = "A Magic Tower strategy game for evaluating TypeSafe Jev decisions"
requires-python = ">=3.10"
dependencies = ["typesafe-sdk>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
jev-magic-tower = "magic_tower.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magic_tower"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

